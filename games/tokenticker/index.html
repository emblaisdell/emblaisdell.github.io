<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover + interactive-widget: the game is played one-handed on a
     phone; we own the notch area and the keyboard must shrink the layout rather
     than scroll it out from under the chat input. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0d0a1e">
<!-- Deployed: set content to the Lambda Function URL from `terraform output bedrock_pipe_url`.
     Left blank, the client posts to same-origin /pipe, which is what the dev server serves. -->
<meta name="pipe-url" content="">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Token Ticker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙️</text></svg>">
<script>
/* Global on purpose: inline onerror= handlers fire for the initial HTML's
   images before app.js (a module, deferred) has executed. */
function spriteFallback(img) {
  img.onerror = null;
  img.src = img.src.replace(/\.png($|\?)/, ".svg$1");
}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="hidden">
  <header id="topbar">
    <div id="logo"><img class="icon gear" src="sprites/logo.png" alt="" onerror="spriteFallback(this)"> <span class="logoText">Token&nbsp;Ticker</span></div>
    <div id="phasePill" class="pill">lobby</div>
    <div id="timer" class="pill timer">--:--</div>
    <div class="spacer"></div>
    <div id="statMoney" class="stat"><img class="icon" src="sprites/coin.png" alt="money" onerror="spriteFallback(this)"> <b>0</b></div>
    <div id="statCompute" class="stat"><img class="icon" src="sprites/gpu.png" alt="compute" onerror="spriteFallback(this)"> <b>0</b> <span class="unit">tok/s</span></div>
    <div id="statAgent" class="stat" title="agent status"><img id="agentFace" class="icon lg" src="sprites/agent.png" alt="agent" onerror="spriteFallback(this)"></div>
  </header>

  <main id="layout">
    <section id="challenges" class="panel" data-tab="solve">
      <h2><img class="icon" src="sprites/trophy.png" alt="" onerror="spriteFallback(this)"> Challenges</h2>
      <!-- Rivals fold into the Solve tab as a slim strip; renderRivals owns #rivalList. -->
      <div id="rivalsStrip">
        <span class="stripLabel">👀</span>
        <div id="rivalList"></div>
      </div>
      <div id="challengeList"></div>
    </section>

    <section id="center">
      <div id="graphPanel" class="panel" data-tab="harness">
        <h2>🧩 Your Harness <span id="runBadge" class="badge hidden">running</span>
          <button id="graphFit" class="ghostBtn" type="button" aria-label="Fit harness to screen">⤢</button>
        </h2>
        <div id="graphScroll"><svg id="graph" preserveAspectRatio="xMidYMid meet"></svg></div>
      </div>
      <div id="shopPanel" class="panel" data-tab="compute">
        <h2><img class="icon" src="sprites/gpu.png" alt="" onerror="spriteFallback(this)"> Buy Compute</h2>
        <div id="computeSummary"></div>
        <div id="shopList"></div>
      </div>
    </section>

    <!-- Persistent agent/harness feed: visible on every tab (no data-tab, so the
         tab shell never hides it). Chat bubbles, thinking, tool chips and the
         harness token stream interleave in one scrolling log. -->
    <section id="feedStrip" class="panel">
      <div id="feedLog"></div>
      <form id="chatForm" autocomplete="off">
        <input id="chatInput" placeholder="Talk to your agent…" maxlength="2000"
               enterkeyhint="send" autocapitalize="sentences" autocorrect="off" spellcheck="false">
        <button id="chatSend" type="submit" aria-label="Send">➤</button>
      </form>
    </section>
  </main>

  <!-- Thumb-reachable tab bar; the only navigation on phones, hidden on desktop. -->
  <nav id="tabbar" role="tablist">
    <button class="tab active" data-tab="solve" role="tab" aria-selected="true">
      <img class="tabIcon" src="sprites/trophy.png" alt="" onerror="spriteFallback(this)"><span>Solve</span>
    </button>
    <button class="tab" data-tab="harness" role="tab" aria-selected="false">
      <span class="tabIcon glyph">🧩</span><span>Harness</span>
    </button>
    <button class="tab" data-tab="compute" role="tab" aria-selected="false">
      <img class="tabIcon" src="sprites/gpu.png" alt="" onerror="spriteFallback(this)"><span>Compute</span>
    </button>
  </nav>
</div>

<div id="joinOverlay" class="overlay">
  <div class="card">
    <div class="bigLogo"><img class="gear" src="sprites/logo.png" alt="Token Ticker gear logo" onerror="spriteFallback(this)"></div>
    <h1>Token Ticker</h1>
    <p class="tag">Build the smartest harness. Win the race. 10 minutes.</p>
    <form id="joinForm">
      <input id="nameInput" placeholder="your name" maxlength="24" required
             enterkeyhint="go" autocapitalize="words" autocorrect="off" spellcheck="false">
      <button type="submit">Plug in 🔌</button>
    </form>
  </div>
</div>

<div id="lobbyOverlay" class="overlay hidden">
  <div class="card">
    <h1 id="lobbyTitle">Lobby</h1>
    <div id="lobbyPlayers"></div>
    <button id="startBtn">Start 10-minute sprint 🏁</button>
    <p class="tag">Everyone races on the same challenges — first solve takes the prize.</p>
  </div>
</div>

<div id="resultsOverlay" class="overlay hidden">
  <div class="card wide">
    <h1>🏁 Results</h1>
    <div id="standings"></div>
    <p class="tag">Resetting for the next sprint…</p>
  </div>
</div>

<div id="fx"></div>
<script type="module" src="app.js"></script>
</body>
</html>
