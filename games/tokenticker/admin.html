<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0a1e">
<title>Token Ticker — Host</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📽️</text></svg>">

<!-- Leaderboard source. Same solved-ledger endpoint the game claims against;
     blank falls back to same-origin, which is what the dev server serves. -->
<meta name="mutex-url" content="">
<meta name="mutex-key" content="">

<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- The gate is a doorbell, not a lock: this is a static page, so the check
     necessarily runs on the client and anyone reading the source can walk past
     it. It exists to stop a player who wanders to /admin.html from projecting
     the leaderboard onto their own phone, nothing more. -->
<div id="gate">
  <form id="gateForm">
    <h1>📽️ Host view</h1>
    <input id="gatePass" type="password" placeholder="passphrase" autocomplete="off" autofocus>
    <button type="submit">Show</button>
    <p id="gateErr" class="err hidden">Not that one.</p>
  </form>
</div>

<main id="stage" class="hidden">
  <header id="bar">
    <div class="brand">📽️ <b>Token Ticker</b></div>
    <div id="status" class="status">—</div>
    <button id="fullscreen" class="ghost" title="Fullscreen">⤢</button>
  </header>

  <section id="joinSide">
    <div id="qrBox"><!-- QR injected here --></div>
    <div id="joinUrl" class="joinUrl">…</div>
    <p class="hint">Scan to play · <span id="playerCount">0</span> solves recorded</p>
  </section>

  <section id="boardSide">
    <h2>Leaderboard</h2>
    <ol id="board"></ol>
    <p id="boardEmpty" class="hint">
      No solves yet. The board fills in as players claim challenges.
    </p>
    <p id="boardOffline" class="hint err hidden">
      Ledger unreachable — showing nothing rather than stale results.
    </p>
  </section>
</main>

<script type="module" src="admin.js"></script>
</body>
</html>
