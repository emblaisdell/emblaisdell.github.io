<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tim — Level Editor</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/editor.css" />
</head>
<body>
  <div id="toolbar">
    <div class="group">
      <span class="title">Tim — Level Editor</span>
    </div>
    <div class="group" id="palette"></div>
    <div class="group">
      <label>dir <span id="dirLabel">→</span></label>
      <button id="rotate" title="Rotate (R)">⟳ Rotate</button>
    </div>
    <div class="group">
      <button id="play" class="primary">▶ Play</button>
      <button id="save">Save</button>
      <button id="load">Load</button>
      <button id="export">Export</button>
      <button id="import">Import</button>
      <button id="clear">Clear</button>
    </div>
    <input id="file" type="file" accept="application/json" hidden />
  </div>

  <div id="hint">
    Left-click/drag: paint &nbsp;•&nbsp; Right-click/drag: erase &nbsp;•&nbsp; R: rotate dir &nbsp;•&nbsp;
    Wheel: zoom &nbsp;•&nbsp; Space-drag: pan &nbsp;•&nbsp; Info: click a cell to add a message
  </div>

  <div id="infoModal" class="modal-backdrop" hidden>
    <div class="modal">
      <h3>Info panel message</h3>
      <p class="modal-sub">Shown at the bottom of the screen while Tim is touching this panel. Leave blank for a silent panel.</p>
      <textarea id="infoModalText" rows="4" placeholder="Type the message…"></textarea>
      <div class="modal-actions">
        <button id="infoModalCancel">Cancel</button>
        <button id="infoModalOk" class="primary">Place&nbsp;(Ctrl+Enter)</button>
      </div>
    </div>
  </div>

  <canvas id="ed"></canvas>

  <script type="module" src="js/editor.js"></script>
</body>
</html>
