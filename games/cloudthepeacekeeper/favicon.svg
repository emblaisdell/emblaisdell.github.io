<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b86ff"/>
      <stop offset="1" stop-color="#a9c4e8"/>
    </linearGradient>
    <linearGradient id="puff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe6f7"/>
    </linearGradient>
  </defs>

  <!-- sky tile -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#sky)"/>

  <!-- little sun in the corner -->
  <circle cx="51" cy="15" r="7" fill="#fff4c8" opacity="0.95"/>

  <!-- fluffy cloud -->
  <g fill="url(#puff)">
    <ellipse cx="32" cy="44" rx="24" ry="9"/>
    <circle cx="17" cy="40" r="11"/>
    <circle cx="28" cy="31" r="14"/>
    <circle cx="41" cy="33" r="12"/>
    <circle cx="49" cy="41" r="9"/>
  </g>

  <!-- cute face -->
  <circle cx="27" cy="36" r="2.6" fill="#33405f"/>
  <circle cx="38" cy="36" r="2.6" fill="#33405f"/>

  <!-- a friendly little lightning bolt -->
  <path d="M33 49 l6 0 l-4 6 l5 0 l-9 11 l2 -8 l-4 0 z" fill="#ffd23e" stroke="#e8a200" stroke-width="0.6" stroke-linejoin="round"/>
</svg>
