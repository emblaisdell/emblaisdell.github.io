<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Black square background with rounded corners (the square's corners, not the triangle's). -->
  <rect x="0" y="0" width="100" height="100" rx="22" ry="22" fill="#000000"/>

  <!-- Red enemy triangle, matching the in-game look: bright stroke, faint fill, soft glow. -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <polygon points="50,15 80.31,67.5 19.69,67.5"
           transform="translate(4.53 4.53) rotate(15 50 50)"
           fill="rgba(200,60,60,0.12)"
           stroke="#ff6b6b" stroke-width="5"
           stroke-linejoin="round"
           filter="url(#glow)"/>
</svg>
