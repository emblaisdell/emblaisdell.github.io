<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141416">
<meta name="mobile-web-app-capable" content="yes">
<title>War on Polygons</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <main id="stage">
    <canvas id="cvbg"></canvas>
    <canvas id="cvfg"></canvas>
    <div id="tip" class="hidden"></div>
  </main>

  <aside id="side">
    <h1>War on <span>Polygons</span></h1>

    <div class="rows">
      <div class="row"><span>Lives</span><b id="hudLives">—</b></div>
      <div class="row"><span>Gold</span><b id="hudGold">—</b></div>
      <div class="row"><span>Wave</span><b id="hudWave">—</b></div>
    </div>

    <div class="acts">
      <button id="btnWave" class="primary">Start Wave 1</button>
      <button id="btnBuild">Buy Circle <em id="buildCost">60</em></button>
    </div>

    <div id="panel" class="hidden">
      <div class="ptitle">Circle <span id="panelTot"></span></div>
      <div id="upRows"></div>
      <div class="prow">
        <button id="btnTarget" class="ghost">Target: First</button>
        <button id="btnSell" class="ghost">Sell <em id="sellVal"></em></button>
      </div>
    </div>

    <div class="ctrls">
      <button id="btnPause">Pause</button>
      <button id="btnFast">1&times;</button>
      <button id="btnMute">Sound</button>
    </div>

    <div id="hint" class="hint"></div>

    <details id="ref">
      <summary>Shape reference</summary>
      <div id="refBody"></div>
    </details>
  </aside>
</div>

<div id="menu" class="overlay">
  <div class="sheet">
    <h2>War on Polygons</h2>
    <p class="lede">The shapes are coming, and they are bringing color. Hold the line.</p>

    <h3>Choose a path</h3>
    <div id="pathPick" class="pick"></div>

    <h3>Choose a difficulty</h3>
    <div id="diffPick" class="pick diff"></div>

    <button id="btnStart" class="primary big">Begin</button>
    <div id="resetWrap" class="hidden"><button id="btnReset" class="ghost">Reset progress</button></div>
  </div>
</div>

<div id="end" class="overlay hidden">
  <div class="sheet center">
    <h2 id="endTitle"></h2>
    <p id="endText" class="endtext"></p>
    <p id="endStats" class="lede"></p>
    <button id="btnAgain" class="primary big">Play again</button>
  </div>
</div>

<script src="src/data.js"></script>
<script src="src/audio.js"></script>
<script src="src/game.js"></script>
<script src="src/render.js"></script>
<script src="src/ui.js"></script>
<script src="src/main.js"></script>
</body>
</html>
